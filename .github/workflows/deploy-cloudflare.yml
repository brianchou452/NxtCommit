name: Deploy OpenAI hackathon product
on:
  workflow_dispatch:
    inputs:
      source_sha:
        description: Exact commoncommit source commit
        required: true
permissions:
  contents: read
concurrency:
  group: cloudflare-openaihackathon
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment:
      name: cloudflare-production
      url: https://openaihackathon.ianjuan.com
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: ianjuantw/commoncommit
          ref: ${{ inputs.source_sha }}
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22.23.2'
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm run check
      - run: make check-version
      - run: npm ci --prefix deploy/cloudflare --no-audit --no-fund
      - name: Verify domain ownership
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
        run: python3 deploy/cloudflare/preflight.py
      - name: Deploy the product container
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          APP_COMMIT=$(git rev-parse HEAD)
          APP_SOURCE_TREE=$(git rev-parse HEAD^{tree})
          npm run deploy --prefix deploy/cloudflare -- --var "APP_COMMIT:$APP_COMMIT" --var "APP_SOURCE_TREE:$APP_SOURCE_TREE"
      - name: Verify serving application and exact source identity
        env:
          EXPECTED_COMMIT: ${{ inputs.source_sha }}
        run: python3 deploy/cloudflare/smoke.py
