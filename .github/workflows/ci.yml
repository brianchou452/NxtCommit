name: CI

on:
  pull_request:
  push:
    branches: [main, 'codex/**']
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

jobs:
  contracts-and-delivery:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r scripts/ci/requirements.txt
      - name: Validate specification schemas
        run: python scripts/ci/validate_specs.py
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22.23.2'
          cache: npm
          cache-dependency-path: deploy/cloudflare/package-lock.json
      - name: Install delivery dependencies
        run: npm ci --prefix deploy/cloudflare
      - name: Test deployment truth boundaries
        run: npm test --prefix deploy/cloudflare
      - name: Validate and bundle Worker without credentials
        run: npm run build --prefix deploy/cloudflare
      - name: Describe verification scope
        if: always()
        run: |
          echo '### CI scope' >> "$GITHUB_STEP_SUMMARY"
          echo 'Contract schemas and deployment infrastructure only. Product tests, UI journeys, and application readiness are not established by this job.' >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: ci-evidence-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts/
          retention-days: 30
          if-no-files-found: warn
