name: CI

on:
  pull_request:
  push:
    # Main is checked exactly once by deploy-cloudflare's reusable CI job.
    branches: ['codex/**']
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

jobs:
  contracts-and-delivery:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r scripts/ci/requirements.txt
      - name: Validate specification schemas
        run: python scripts/ci/validate_specs.py
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22.23.2'
          cache: npm
          cache-dependency-path: deploy/cloudflare/package-lock.json
      - name: Install delivery dependencies
        run: npm ci --prefix deploy/cloudflare
      - name: Test deployment truth boundaries
        run: npm test --prefix deploy/cloudflare
      - name: Validate and bundle Worker without credentials
        run: npm run build --prefix deploy/cloudflare
      - name: Describe verification scope
        if: always()
        run: |
          echo '### CI scope' >> "$GITHUB_STEP_SUMMARY"
          echo 'Contract schemas, gateway tests and container image build. Application foundation checks run in their separate job.' >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: ci-evidence-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts/
          retention-days: 30
          if-no-files-found: warn

  application-foundation:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24.19.0'
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci --ignore-scripts
      - name: Typecheck, server tests and production build
        run: |
          mkdir -p artifacts
          set -o pipefail
          npm run check 2>&1 | tee artifacts/application-check.log
      - run: npm run check-version
      - name: Set up cached Docker builder
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - name: Build browser image with reusable layers
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          file: e2e/Dockerfile
          load: true
          tags: nxtcommit-e2e:${{ github.sha }}
          cache-from: type=gha,scope=nxtcommit-e2e
          cache-to: type=gha,scope=nxtcommit-e2e,mode=max,ignore-error=true
      - name: Foundation browser journeys in Docker
        env:
          E2E_PREBUILT_IMAGE: nxtcommit-e2e:${{ github.sha }}
        run: npm run test:e2e
      - name: Record application verification scope
        if: always()
        run: |
          echo '### Application foundation' >> "$GITHUB_STEP_SUMMARY"
          echo 'TypeScript checks, server tests, production build and Docker foundation journeys. TODO cases remain unimplemented; visual equality and Phase 2 features are not certified.' >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: application-evidence-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            artifacts/
            test-results/docker/foundation/
          retention-days: 30
          if-no-files-found: warn
