$schema: https://json-schema.org/draft/2020-12/schema
$id: domain.schema.yaml
type: object
additionalProperties: false
required: [spec_version, kind, id, title, summary, entities, invariants, derived_from]
properties:
  spec_version: { const: 1 }
  kind: { const: domain }
  id: { type: string, pattern: '^domain\.[a-z0-9-]+$' }
  title: { type: string }
  summary: { type: string }
  entities:
    type: array
    minItems: 1
    items: { $ref: '#/$defs/entity' }
  relations:
    type: array
    items: { type: string }
  invariants:
    type: array
    minItems: 1
    items: { type: string }
  derived_from:
    type: array
    items: { type: string }
$defs:
  entity:
    type: object
    additionalProperties: false
    required: [name, description, fields]
    properties:
      name: { type: string, pattern: '^[a-z][a-z0-9_]*$' }
      description: { type: string }
      fields:
        type: array
        minItems: 1
        items:
          type: object
          additionalProperties: false
          required: [name, type, required, description]
          properties:
            name: { type: string }
            type: { type: string }
            required: { type: boolean }
            description: { type: string }
            values: { type: array, items: { type: [string, number, boolean] } }
            derived: { type: boolean }
