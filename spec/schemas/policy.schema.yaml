$schema: https://json-schema.org/draft/2020-12/schema
$id: policy.schema.yaml
type: object
additionalProperties: false
required: [spec_version, kind, id, title, scope, rules]
properties:
  spec_version: { const: 1 }
  kind: { const: policy }
  id: { type: string, pattern: '^policy\.[a-z0-9-]+$' }
  title: { type: string }
  scope:
    type: array
    minItems: 1
    items: { type: string, pattern: '^(page|component|api|domain|persistence)\.' }
  rules:
    type: array
    minItems: 1
    items:
      type: object
      additionalProperties: false
      required: [id, requirement, enforcement]
      properties:
        id: { type: string, pattern: '^[a-z0-9-]+$' }
        trigger: { type: string }
        requirement: { type: string }
        outcome: { type: string }
        enforcement: { enum: [server, client, test, manual_review] }
