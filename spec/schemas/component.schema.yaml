$schema: https://json-schema.org/draft/2020-12/schema
$id: component.schema.yaml
type: object
additionalProperties: false
required: [spec_version, kind, id, title, purpose, inputs, component_dependencies, data_dependencies, states, interactions, content, visual_design, scenarios]
properties:
  spec_version: { const: 1 }
  kind: { const: component }
  id: { type: string, pattern: '^component\.[a-z0-9-]+$' }
  title: { type: string }
  purpose: { type: string }
  inputs: { type: array, items: { $ref: '#/$defs/input' } }
  component_dependencies:
    type: array
    items: { type: string, pattern: '^component\.' }
  data_dependencies: { type: array, items: { $ref: '#/$defs/dependency' } }
  states: { type: array, minItems: 1, items: { $ref: '#/$defs/state' } }
  interactions: { type: array, items: { $ref: '#/$defs/interaction' } }
  runtime_authority: { type: string, minLength: 1 }
  terminal_outcomes: { type: array, minItems: 1, items: { type: string, minLength: 1 } }
  test_constraints: { type: array, minItems: 1, items: { type: string, minLength: 1 } }
  content:
    type: object
    additionalProperties: false
    required: [locales, dynamic_labels]
    properties:
      locales:
        type: object
        additionalProperties:
          type: object
          additionalProperties: { type: string }
      dynamic_labels:
        type: array
        items:
          type: object
          additionalProperties: false
          required: [name, source, fallback]
          properties:
            name: { type: string }
            source: { type: string }
            fallback: { type: string }
  visual_design: { $ref: '#/$defs/design' }
  scenarios: { $ref: '#/$defs/scenarios' }
$defs:
  input:
    type: object
    additionalProperties: false
    required: [name, type, required, description]
    properties:
      name: { type: string }
      type: { type: string }
      required: { type: boolean }
      description: { type: string }
  dependency:
    type: object
    additionalProperties: false
    required: [kind, endpoint, purpose]
    properties:
      kind: { enum: [api, event_stream] }
      endpoint: { type: string }
      purpose: { type: string }
  state:
    type: object
    additionalProperties: false
    required: [name, condition, rendering]
    properties:
      name: { type: string }
      condition: { type: string }
      rendering: { type: string }
  interaction:
    type: object
    additionalProperties: false
    required: [trigger, result]
    properties:
      trigger: { type: string }
      result: { type: string }
  design:
    type: object
    additionalProperties: false
    required: [design_system_id, hierarchy, layout, geometry, colour_semantics, surface, typography, motion, visual_anchors]
    properties:
      design_system_id: { type: string, pattern: '^design-system\.' }
      hierarchy:
        type: array
        minItems: 1
        items: { type: string, minLength: 1 }
      layout: { type: string }
      geometry: { type: string }
      colour_semantics: { type: string }
      surface: { type: string }
      typography: { type: string }
      motion: { type: string }
      visual_anchors:
        type: array
        minItems: 1
        items: { type: string, minLength: 1 }
  scenario:
    type: object
    additionalProperties: false
    required: [id, given, when, then, test_file]
    properties:
      id: { type: string, pattern: '^[a-z0-9-]+$' }
      given: { type: string }
      when: { type: string }
      then: { type: string }
      test_file: { type: string, pattern: '^(server/.+\.test\.ts|e2e/.+\.spec\.ts)$' }
  scenarios:
    type: array
    minItems: 1
    items: { $ref: '#/$defs/scenario' }
