spec_version: 1
kind: component
id: component.hero
title: Commitment hero
purpose: 在首頁第一屏連結開源交付的價值主張、可追溯 aggregate 與 campaign discovery。
inputs:
  - name: impact_snapshot
    type: loading | error | ready(stats, donor_beacons)
    required: true
    description: 首頁取得的 impact snapshot；ready 時提供已驗證來源的 aggregate。
component_dependencies: []
data_dependencies:
  - kind: api
    endpoint: /api/marketplace
    purpose: 讀取 compute committed、backer count 與 shipped release count。
states:
  - name: waiting_for_data
    condition: impact snapshot 尚未 ready 或 marketplace 尚未回應。
    rendering: 保留全部敘事內容；尚不可得的數字顯示 em dash，不顯示 0。
  - name: ready
    condition: impact snapshot 與 marketplace snapshot 已可用。
    rendering: 顯示四個 aggregate signal 與其語意標籤。
  - name: marketplace_fetch_failed
    condition: marketplace 請求失敗。
    rendering: impact snapshot 仍可顯示；僅 marketplace 專屬數字維持 em dash，沒有 error modal。
interactions:
  - trigger: 選擇主要 CTA。
    result: 使用頁內錨點移至 workflow 互動示例。
  - trigger: 元件保持可見超過 4.2 秒。
    result: 將三筆 illustrated workflow 中的 highlighted event 輪替到下一筆；不聲稱事件是 GitHub live data。
content:
  locales:
    en:
      headline_line_1: "Your repo. Your quality bar."
      headline_line_2: "A workflow agents can follow."
      supporting_text: "Turn maintainer requirements into repo-specific development workflows that agents follow and tests verify."
      primary_cta: "Explore the workflow"
      provenance_label: "Illustrated concept"
      provenance_note: "Permanent rules need maintainer confirmation. This is not a live review or execution feed."
      pipeline_title: "From feedback to future acceptance"
      pipeline_subtitle: "Fix this change. Carry the right rule forward."
      pipeline_listening: "Listening for the next event"
      event_1: "This PR · Add keyboard verification, fix issues and rerun tests"
      event_2: "Proposed rule · Preserve source, scope and executable checks"
      event_3: "After confirmation · The next form task inherits a new acceptance gate"
    zh-TW:
      headline_line_1: "把維護者的品質要求，"
      headline_line_2: "轉成可遵守、可驗證的開發流程。"
      supporting_text: "以儲存庫專屬流程驅動代理開發：測試驗收本次修改，審查回饋累積後續規則。"
      primary_cta: "看懂開發流程"
      provenance_label: "流程示意"
      provenance_note: "永久規則須經維護者確認；此處不是即時審查或執行紀錄。"
      pipeline_title: "從回饋到下一次驗收"
      pipeline_subtitle: "改對一次，也留下下一次能用的規則。"
      pipeline_listening: "等待下一筆事件"
      event_1: "本次修正｜補上鍵盤驗證、修正問題、重新測試"
      event_2: "候選規則｜保留回饋來源、適用範圍與檢查方式"
      event_3: "確認後生效｜新版流程讓下一個表單任務多一道驗收關卡"
  dynamic_labels:
    - name: compute_committed
      source: marketplace.stats.totalPledged
      fallback: '—'
    - name: backers
      source: marketplace.stats.contributors
      fallback: '—'
    - name: repos_moved
      source: impact.stats.projectsRevived
      fallback: '—'
    - name: releases_shipped
      source: marketplace.stats.missionsShipped
      fallback: '—'
visual_design:
  design_system_id: design-system.nxtcommit
  hierarchy:
    - Provenance kicker establishes open-source and demo context.
    - Two-part display headline carries the primary promise, followed by supporting copy and the campaign CTA.
    - Four aggregate signals close the editorial column; the illustrated workflow is the secondary visual narrative.
  layout: 左側為 value proposition、CTA 與四格 signal grid；右側為深靛色 pipeline panel。
  geometry: Desktop uses an approximately 0.86/1.14 editorial-to-pipeline split inside a full-width opening section; the hero occupies about the first viewport below persistent chrome.
  colour_semantics: 一般敘事使用 paper/ink；pipeline 為 deep indigo；compute 用 mint、backers 用 blue、repos 用 violet、release 用 amber。
  surface: The editorial side stays on the light canvas; the pipeline uses an extra-large rounded deep-indigo gradient panel with subtle dot field, orbit, border, and broad violet shadow. Use spec/assets/home/nxtcommit-token-stream.png as the canonical decorative token-stream artwork; code generation must copy or import the committed 2176 x 962 RGBA PNG verbatim and preserve its aspect ratio rather than regenerate it.
  typography: headline 為大尺寸 DM Sans/Noto Sans TC；signal label 與 pipeline metadata 使用 uppercase monospace。
  motion: pipeline highlight 每 4.2 秒低頻輪播；decorative motion 在 prefers-reduced-motion 下停用，內容與目前狀態仍可讀。
  visual_anchors:
    - The headline and pipeline title share one visual centre on desktop.
    - The gradient second headline line is the strongest brand accent on the light half.
    - The primary CTA is a black pill and remains visually distinct from the violet categorical metrics.
scenarios:
  - id: hero-links-the-story-to-real-payloads
    given: 首頁提供 impact snapshot
    when: Hero component render
    then: 它連到 campaign section、讀取 marketplace aggregate，並把未知數值顯示為 unknown 而非虛構的零
    test_file: server/landing.test.ts
