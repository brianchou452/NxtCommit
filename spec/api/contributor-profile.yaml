spec_version: 1
kind: api
id: api.contributor-profile
title: Contributor profile
summary: Aggregate local persona, wallet, pledges, receipts and deterministic achievements with demo provenance.
transport: http
endpoint: { method: GET, path: /api/contributors/:id }
request:
  path_parameters: [{ type: string, description: Contributor identifier., required: true }]
  query_parameters: []
  headers: []
  body: null
responses:
  - status: 200
    description: ContributorProfile with dataMode demo.
    body:
      type: object
      description: Local contributor aggregate.
      properties:
        id: { type: string, description: Contributor id., required: true }
        name: { type: string, description: Seeded/local display name., required: true }
        handle: { type: string, description: Local handle., required: true }
        avatarColor: { type: string, description: Presentation colour., required: true }
        bio: { type: object, description: Localized biography., required: true }
        walletBalance: { type: integer, description: Prototype credit balance., required: true }
        totalPledged: { type: integer, description: Local pledged credits., required: true }
        reputation: { type: integer, description: Local demo reputation., required: true }
        joinedAt: { type: string, description: Seed/local ISO timestamp., required: true }
        dataMode: { type: string, description: Aggregate provenance., required: true, enum: [demo] }
        stats: { type: object, description: Credits consumed/refunded and local release totals., required: true }
        pledges: { type: array, description: Local pledge records., required: true, items: { type: object, description: Mission pledge summary. } }
        receipts: { type: array, description: Traceable mission impact receipts., required: true, items: { type: object, description: Accounting execution review release and optional adoption chain. } }
        achievements: { type: array, description: Earned deterministic achievement records., required: true, items: { type: object, description: Achievement with code and timestamp. } }
        achievementDefs: { type: array, description: Definitions used to render earned records., required: true, items: { type: object, description: Code name description tier and icon. } }
  - { status: 404, description: Contributor does not exist., body: { type: object, description: Error message., properties: { error: { type: string, description: Safe not-found message., required: true } } } }
trust_boundary:
  authentication: None; profile is not an authenticated account.
  data_mode: Seeded persona aggregated over real local ledger and run records.
  forbidden_claims: [verified identity, transferable wallet, real provider adoption]
scenarios:
  - { id: contributor-profile-route, given: A seeded or local contributor exists., when: Its profile is requested., then: Local records and dataMode are returned while unknown external facts remain absent., test_file: server/product-spec.bdd.test.ts }
